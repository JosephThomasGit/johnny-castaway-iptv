services:
  johnny-castaway:
    build: .
    container_name: johnny-tv
    environment:
      - SCR_PATH=/host_media/jc15.exe
    volumes:
      - /path/to/your/local/folder:/host_media:ro
    ports:
      - "9081:9081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.50'
